name: netcup-Statuskommentar bauen
on:
  push:
    branches:
      - build/netcup-statuskommentar
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: PHP-Syntax und Statuskommentare prüfen
        run: |
          php -l public/index.php
          php -l private/app.php
          php -l private/mail.php
          php -l private/worker.php
          php <<'PHP'
          <?php
          require 'private/app.php';
          require 'private/mail.php';
          $db = new PDO('sqlite::memory:', null, null, [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION, PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC]);
          $db->exec('PRAGMA foreign_keys = ON');
          $db->exec(file_get_contents('private/schema.sql'));
          query($db, "INSERT INTO tickets(email,subject,body,received_at) VALUES('customer@example.com','Test','Anfrage',100)");
          function check(bool $ok, string $message): void
          {
              if (!$ok) {
                  throw new RuntimeException($message);
              }
          }
          $comment = 'Wir haben die <Ersatzteile> bestellt.';
          check(saveAdminTicket($db, 1, 0, ['Offen','Normal','','Intern'], $comment) === 'status-unchanged', 'Kommentar ohne Statuswechsel wurde akzeptiert');
          check(saveAdminTicket($db, 1, 0, ['In Arbeit','Hoch','','Vertraulich'], $comment) === 'saved', 'Status und Kommentar konnten nicht gespeichert werden');
          check(saveAdminTicket($db, 1, 0, ['Wartet','Normal','',''], 'Veralteter Kommentar') === 'stale', 'Alte Revision wurde akzeptiert');
          check((int) query($db, 'SELECT COUNT(*) FROM outbox')->fetchColumn() === 1, 'Mehr als eine Mail für einen Statuswechsel');
          check(query($db, 'SELECT body FROM ticket_comments WHERE ticket_id = 1')->fetchColumn() === $comment, 'Kommentar fehlt in der Konversation');
          check(query($db, 'SELECT notes FROM tickets WHERE id = 1')->fetchColumn() === 'Vertraulich', 'Interne Notiz fehlt');
          $config = ['admin_email'=>'admin@example.com','base_url'=>'https://tickets.invalid/','mail_email'=>'ticket@example.com','secret'=>str_repeat('a',64)];
          $mails = [];
          $sender = static function ($config, $to, $subject, $body, $id) use (&$mails) {
              $mails[] = [$config, $to, $subject, $body, $id];
          };
          check(deliverOutbox($db, $config, $sender)['sent'] === 1, 'Statusmail wurde nicht verarbeitet');
          [$delivery, $to, $subject, $body, $id] = $mails[0];
          check($to === 'customer@example.com' && $subject === 'Statusänderung zu Ticket T-0001', 'Statusmail hat falschen Empfänger oder Betreff');
          check(str_contains($body, 'von „Offen“ auf „In Arbeit“') && str_contains($body, $comment) && !str_contains($body, 'Vertraulich'), 'Statusmail enthält den falschen Inhalt');
          check($delivery['show_company_logo'] && str_contains(renderHtmlMail($config['base_url'], $subject, $body, ''), '&lt;Ersatzteile&gt;'), 'Logo-Flag oder HTML-Aufbereitung fehlt');
          check((int) query($db, 'SELECT COUNT(*) FROM ticket_mail_references')->fetchColumn() === 1, 'Antwortreferenz fehlt');
          check(saveAdminTicket($db, 1, 1, ['Wartet','Normal','','Vertraulich'], '') === 'saved', 'Ein gewöhnlicher Statuswechsel ist fehlgeschlagen');
          check(deliverOutbox($db, $config, $sender)['sent'] === 1 && !str_contains($mails[1][3], 'Kommentar zur Statusänderung'), 'Statusmail ohne Kommentar defekt');
          check(str_contains(file_get_contents('public/style.css'), '.badge.ticket-new'), 'Sichtbare Neu-Markierung fehlt');
          PHP
      - name: Installationsdateien zusammenstellen
        run: |
          composer install --working-dir=private --no-dev --no-interaction --prefer-dist --no-scripts
          php private/worker.php --check
          mkdir netcup
          cp -R private public README.md NETCUP.md netcup/
          test ! -f netcup/private/config.php
          test ! -d netcup/private/data
          printf '%s\n' 'Vollständiges Update für eine vorhandene netcup-Installation.' 'ZIP im Verzeichnis entpacken, in dem public und private liegen. Installation und Update sind in README.md und NETCUP.md beschrieben.' > netcup/UPDATE.txt
      - name: Vollpaket bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Waxenberger-Ticketportal-Vollpaket-Statuskommentar
          path: netcup/
          if-no-files-found: error
          retention-days: 30
